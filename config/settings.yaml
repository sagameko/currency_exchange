api:
  base_url: https://api.frankfurter.dev/v1
  timeout_seconds: 30

rates:
  base_currency: AUD
  currencies: [USD, EUR, CNY, JPY]
  
incremental:
  initial_start_date: 2020-01-01   # first run loads history from this date
  lookback_days: 3                 # re-load the last few days to catch corrections

paths:
  raw_dir: data/raw
  clean_dir: data/clean
  database: data/warehouse.duckdb
  log_dir: logs

quality:
  max_bad_ratio: 0.05