[project]
name = "currency-exchange"
version = "0.1.0"
description = "Incremental ETL pipeline for daily AUD exchange rates into DuckDB start schema"
readme = "README.md"
authors = [
    { name = "Jack Nguyen", email = "sagameko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
currency-exchange = "fx_pipeline.main:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
